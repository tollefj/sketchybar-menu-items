name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: make release
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/menu-items-macos-universal.tar.gz
